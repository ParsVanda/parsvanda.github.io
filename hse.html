<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>واحد HSE - پارس وندا</title>



<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family: b nazanin,b nazanin,b nazanin;
    background:#f2f4f7;
    color:#222;
}

body{
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:12px;
}

/* HEADER */

.header{
    background:#fff;
    border-radius:18px;
    padding:14px;
    box-shadow:0 3px 14px rgba(0,0,0,.08);
    margin-bottom:12px;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.logo{
    width:140px;
    height:140px;
    object-fit:contain;
    border-radius:15px;
}

.title-area{
    text-align:center;
}

.title-area h1{
    margin:0 0 7px;
    font-size:24px;
    color:#173b68;
}

.developer{
    font-size:13px;
    color:#777;
}

/* ONLINE STATUS */

.connection{
    margin-top:12px;
    text-align:center;
    font-size:13px;
    padding:8px;
    border-radius:10px;
    background:#fff8dc;
    color:#856404;
}

.connection.online{
    background:#e8f8ee;
    color:#18733c;
}

.connection.error{
    background:#fdeaea;
    color:#a51d1d;
}

/* FORM CONTROLS */

.form-controls{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
}

.control-box{
    background:#f7f9fb;
    padding:10px;
    border-radius:12px;
}

.control-box label{
    display:block;
    font-size:13px;
    margin-bottom:6px;
    color:#555;
}

input,select{
    width:100%;
    height:44px;
    border:1px solid #d3d8df;
    border-radius:9px;
    padding:0 10px;
    background:white;
    font-family:inherit;
    font-size:15px;
}

input:focus,select:focus{
    outline:none;
    border-color:#3274c5;
    box-shadow:0 0 0 2px rgba(50,116,197,.12);
}

input[readonly]{
    background:#edf1f5;
}

/* BUTTONS */

.buttons{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-top:12px;
}

button{
    border:none;
    border-radius:10px;
    min-height:44px;
    padding:8px 12px;
    font-family:inherit;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn-save{
    background:#198754;
    color:white;
}

.btn-search{
    background:#1769aa;
    color:white;
}

.btn-clear{
    background:#dc3545;
    color:white;
}

button:active{
    transform:scale(.98);
}

/* TECHNICAL MANAGER REQUEST PANEL */
.technical-request-panel{background:#fff;border:1px solid #dfe4e9;border-radius:14px;padding:12px;box-shadow:0 3px 12px rgba(0,0,0,.06);margin-bottom:12px;}
.technical-blue-panel{background:#fff;color:#222;border:1px solid #dfe4e9;border-radius:14px;padding:14px;box-shadow:0 3px 12px rgba(0,0,0,.06);margin-bottom:12px;}
.technical-blue-panel .technical-request-note,.technical-blue-panel .hse-section-note{color:#667085}
.request-month-group{margin-bottom:16px;border:1px solid #e5ebf2;border-radius:14px;overflow:hidden;background:#fff;font-family:b nazanin,b nazanin,b nazanin}
.request-month-group>summary{list-style:none;cursor:pointer;padding:13px 14px;background:#f1f6fb;font-weight:bold;color:#1769e0;font-size:15px;font-family:b nazanin,b nazanin,b nazanin;display:flex;align-items:center;justify-content:space-between}
.request-month-group>summary::-webkit-details-marker{display:none}
.request-month-group>summary:after{content:"⌄";font-size:18px;transition:transform .2s}
.request-month-group[open]>summary:after{transform:rotate(180deg)}
.request-day-group{margin:8px 0;border:1px solid #e5ebf2;border-radius:12px;overflow:hidden;background:#fff}
.request-day-group>summary{list-style:none;cursor:pointer;padding:11px 13px;background:#fafcff;font-weight:bold;color:#344054;font-size:15px;font-family:b nazanin,b nazanin,b nazanin;display:flex;align-items:center;justify-content:space-between}
.request-day-group>summary::-webkit-details-marker{display:none}
.request-day-group>summary:after{content:"⌄";font-size:17px;transition:transform .2s}
.request-day-group[open]>summary:after{transform:rotate(180deg)}
.request-group-content{padding:0 8px 8px}
.technical-blue-panel .technical-request-item,.technical-blue-panel .hse-request-card{background:#fff;color:#1f2937}

.technical-request-title{font-weight:bold;font-size:16px;margin-bottom:5px;color:#173b68;}
.technical-request-note{font-size:12px;color:#667085;margin-bottom:10px;}
.technical-new-request-toggle{display:flex;justify-content:space-between;align-items:center;background:#f5f8fb;border:1px solid #dfe4e9;border-radius:11px;padding:12px;cursor:pointer;font-weight:bold;color:#173b68;}
.technical-new-request-box{display:none;padding:10px 0 2px;}
.technical-new-request-box.open{display:block;}
.technical-new-request-box label{display:block;margin-bottom:6px;font-size:13px;font-weight:bold;color:#555;}
.technical-request-list{margin-top:10px;display:grid;gap:8px;}
.technical-request-item{border:1px solid #dfe4e9;border-radius:11px;overflow:hidden;background:#fff;}
.technical-request-row{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;cursor:pointer;background:#f8fafc;}
.technical-request-row-right{display:flex;align-items:center;gap:10px;font-size:18px;}
.technical-request-static{padding:10px 12px;}
.technical-request-text-small{font-family:b nazanin,b nazanin,b nazanin;font-size:14px;line-height:1.9;color:#344054;white-space:pre-wrap;background:#f8fafc;border-radius:9px;padding:9px;}
.technical-request-meta-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;}
.technical-request-delete-wrap{display:flex;justify-content:flex-start;margin-top:8px;}
.technical-request-delete-btn{border:1px solid #f1b8b8;background:#fff5f5;color:#b42318;border-radius:8px;padding:6px 10px;font-family:inherit;font-size:11px;cursor:pointer;}
.technical-request-date{font-family:b nazanin,b nazanin,b nazanin;display:block;font-size:14px;color:#7b8794;margin-top:3px;font-weight:normal;}
.technical-request-body{display:none;padding:10px;border-top:1px solid #e8edf2;}
.technical-request-body.open{display:block;}
.technical-request-text{font-family:b nazanin,b nazanin,b nazanin;font-size:14px;background:#f8fafc;border-radius:9px;padding:10px;line-height:1.8;white-space:pre-wrap;}
.technical-response{margin-top:8px;background:#f1f8f3;border-radius:9px;padding:9px;line-height:1.8;font-size:14px;font-family:b nazanin,b nazanin,b nazanin;}
.technical-empty{text-align:center;color:#7b8794;font-size:13px;padding:18px 8px;}

/* ROLE CARD */

.role-card{
    background:white;
    border-radius:16px;
    margin-bottom:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    overflow:hidden;
}

.role-header{
    width:100%;
    border-radius:0;
    background:#173b68;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-align:right;
    padding:15px;
    min-height:52px;
}

.role-header span:last-child{
    font-size:13px;
    opacity:.9;
}

.role-content{
    display:none;
    padding:10px;
}

.role-content.open{
    display:block;
}

/* SHIFT */

.shift-box{
    border:1px solid #dfe4e9;
    border-radius:12px;
    overflow:hidden;
    margin-bottom:10px;
}

.shift-header{
    background:#eef3f8;
    padding:12px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-weight:bold;
    color:#173b68;
}

.shift-content{
    display:none;
    padding:10px;
}

.shift-content.open{
    display:block;
}

/* EMPLOYEE */

.employee-box{
    margin-bottom:10px;
}

.employee-box label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    color:#555;
}

/* CHECKLIST TABLE */

/* جدول چک‌لیست با ستون توضیحات اختصاصی هر آیتم */
.table-wrapper{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

.checklist-table{
    width:100%;
    min-width:720px;
    border-collapse:collapse;
    table-layout:fixed;
}

.checklist-table th,
.checklist-table td{
    border:1px solid #d9dee4;
    padding:8px 6px;
    vertical-align:middle;
    word-wrap:break-word;
    overflow-wrap:anywhere;
}

.checklist-table th{
    background:#173b68;
    color:white;
    font-size:13px;
}

.checklist-table th:nth-child(1),
.checklist-table td:nth-child(1){
    width:7%;
    text-align:center;
}

.checklist-table th:nth-child(2),
.checklist-table td:nth-child(2){
    width:43%;
    text-align:right;
}

.checklist-table th:nth-child(3),
.checklist-table td:nth-child(3){
    width:22%;
    text-align:center;
}

.checklist-table th:nth-child(4),
.checklist-table td:nth-child(4){
    width:28%;
    text-align:right;
}

.item-description{
    width:100%;
    min-width:150px;
    min-height:42px;
    resize:vertical;
    box-sizing:border-box;
    border:1px solid #d3d8df;
    border-radius:7px;
    padding:6px 8px;
    font-family:inherit;
    font-size:12px;
    line-height:1.5;
    background:#fff;
}
.item-description:focus{outline:none;border-color:#3274c5;box-shadow:0 0 0 2px rgba(50,116,197,.12);}

/* STATUS */

.status-cell{
    text-align:center !important;
}

.status-options{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:8px;
    white-space:nowrap;
}
.status-option{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    font-size:12px;
    white-space:nowrap;
    cursor:pointer;
}

.status-option input{
    width:17px;
    height:17px;
    margin:0;
    padding:0;
    cursor:pointer;
}

/* DESCRIPTION */
.shift-save-area{display:flex;justify-content:center;margin-top:14px;padding-top:4px;}
.shift-save-btn{width:100%;max-width:320px;}
.shift-save-btn:disabled{opacity:.7;cursor:not-allowed;}

.description-box{margin:10px 0;}
.description-box label{display:block;margin-bottom:6px;font-size:13px;color:#555;}
.description-box textarea{width:100%;min-height:75px;resize:vertical;border:1px solid #d3d8df;border-radius:9px;padding:9px 10px;font-family:inherit;font-size:14px;background:#fff;}
.description-box textarea:focus{outline:none;border-color:#3274c5;box-shadow:0 0 0 2px rgba(50,116,197,.12);}
.form-locked{opacity:.75;}
button:disabled,input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.65;}

/* SEARCH */

.search-panel{
    display:none;
    background:white;
    border-radius:15px;
    padding:12px;
    margin-bottom:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.search-panel.open{
    display:block;
}

.search-item{
    border:1px solid #ddd;
    border-radius:10px;
    padding:10px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.search-info{
    font-size:13px;
}

.search-load{
    background:#1769aa;
    color:white;
    min-height:38px;
    padding:5px 10px;
}

/* LOADING */

.loading{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.loading.show{
    display:flex;
}

.loading-box{
    background:white;
    border-radius:14px;
    padding:22px 30px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #ddd;
    border-top-color:#1769aa;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* MESSAGE */

.message{
    position:fixed;
    bottom:18px;
    right:18px;
    left:18px;
    max-width:500px;
    margin:auto;
    background:#173b68;
    color:white;
    padding:12px 15px;
    border-radius:11px;
    text-align:center;
    display:none;
    z-index:10000;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.message.show{
    display:block;
}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:8px;
    }

    .header{
        border-radius:14px;
        padding:10px;
    }

    .header-top{
        gap:8px;
    }

    .logo{
        width:15px;
        height:18px;
    }

    .title-area h1{
        font-size:19px;
    }

    .developer{
        font-size:11px;
    }

    .form-controls{
        grid-template-columns:1fr 1fr;
        gap:7px;
    }

    .control-box{
        padding:7px;
    }

    .control-box label{
        font-size:11px;
    }

    input,select{
        height:40px;
        font-size:13px;
    }

    .buttons{
        grid-template-columns:1fr;
        gap:7px;
    }

    .buttons button{
        min-height:42px;
    }

    .role-header{
        padding:13px 11px;
        font-size:14px;
    }

    .role-content{
        padding:7px;
    }

    .shift-header{
        font-size:13px;
        padding:11px 9px;
    }

    .shift-content{
        padding:7px;
    }

    .checklist-table th,
    .checklist-table td{
        padding:7px 4px;
        font-size:12px;
    }

    .checklist-table th:nth-child(1),
    .checklist-table td:nth-child(1){
        width:11%;
    }

    .checklist-table th:nth-child(2),
    .checklist-table td:nth-child(2){
        width:54%;
    }

    .checklist-table th:nth-child(3),
    .checklist-table td:nth-child(3){
        width:25%;
    }

    .status-option{
        font-size:10px;
        gap:3px;
    }

    .status-option input{
        width:15px;
        height:15px;
    }

    .description-box textarea{min-height:65px;font-size:13px;}

    .search-item{
        flex-direction:column;
        align-items:stretch;
        text-align:center;
    }
}

/* VERY SMALL PHONES */

@media(max-width:360px){

    .title-area h1{
        font-size:17px;
    }

    .checklist-table th,
    .checklist-table td{
        font-size:11px;
        padding:6px 3px;
    }

    .status-option{
        font-size:9px;
    }

    .status-option input{
        width:14px;
        height:14px;
    }
}

.login-box{width:100%;max-width:380px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.32);border-radius:24px;padding:28px 22px;box-shadow:0 18px 55px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.24);backdrop-filter:blur(17px);-webkit-backdrop-filter:blur(17px);text-align:center;color:#fff;}
.login-box h2{margin:0 0 8px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.login-box p{margin:0 0 20px;color:rgba(255,255,255,.9);font-size:13px;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.login-box input{width:100%;text-align:center;letter-spacing:8px;font-size:22px;font-weight:bold;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.7);color:#222}
.login-btn{width:100%;margin-top:12px;background:rgba(25,135,84,.92);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.login-error{min-height:22px;margin-top:10px;color:#fff;font-size:13px;text-shadow:0 2px 7px rgba(0,0,0,.6)}
.role-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding:7px 12px;
    border-radius:999px;
    background:#eaf2ff;
    color:#173b68;
    font-size:12px;
    font-weight:bold;
}
.logout-btn{
    background:#dc3545;
    color:#fff;
    min-height:38px;
    padding:6px 12px;
    font-size:12px;
}
.manager-only{
    display:none;
}

.hse-request-card{margin:14px 0;padding:18px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(25,135,84,.18));box-shadow:0 12px 30px rgba(0,0,0,.20);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
.hse-request-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.hse-request-title{font-size:16px;font-weight:800}.hse-request-status{padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800}.hse-request-status.pending{background:rgba(255,193,7,.16);color:#ffd86b;border:1px solid rgba(255,193,7,.35)}.hse-request-status.approved{background:rgba(25,135,84,.18);color:#69f0ae;border:1px solid rgba(92,255,174,.38)}.hse-request-status.rejected{background:rgba(220,53,69,.18);color:#ff8f9b;border:1px solid rgba(220,53,69,.38)}.hse-request-textarea{font-family:b nazanin,b nazanin,b nazanin!important;font-size:14px!important;width:100%;min-height:130px;resize:vertical;box-sizing:border-box;padding:13px;border-radius:13px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.14);color:inherit;outline:none;font-family:inherit;line-height:1.9}.hse-request-textarea:focus{border-color:rgba(92,255,174,.55)}.technical-compact-box{min-height:68px;height:68px;line-height:1.7;padding:9px}.hse-request-actions{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.hse-request-btn{border:0;border-radius:11px;padding:10px 16px;cursor:pointer;font-family:inherit;font-weight:800}.hse-send-btn{background:#198754;color:#fff}.hse-approve-btn{background:#198754;color:#fff}.hse-reject-btn{background:#dc3545;color:#fff}.hse-response-btn{background:#315a86;color:#fff}.hse-approval-actions{display:flex;gap:10px;margin-top:12px}.hse-approval-actions .hse-request-btn{font-size:13px}.hse-response-label{display:block;margin:14px 0 7px;font-size:13px;font-weight:700}.hse-request-meta{font-family:b nazanin,b nazanin,b nazanin;font-size:14px;opacity:.68;margin:-6px 0 12px}.hse-request-view{font-family:b nazanin,b nazanin,b nazanin;font-size:14px;white-space:pre-wrap;line-height:1.9;padding:13px;border-radius:13px;background:rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.12)}.hse-hse-response{margin-top:12px;padding:12px;border-radius:12px;background:rgba(25,135,84,.10);border:1px solid rgba(255,255,255,.12);line-height:1.9}.hse-readonly{opacity:.92}.hse-permit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:18px 0 6px;}
.hse-permit-card{position:relative;min-height:145px;padding:20px;border-radius:20px;border:1px solid rgba(92,255,174,.38);background:linear-gradient(135deg,rgba(25,135,84,.34),rgba(255,255,255,.09));box-shadow:0 12px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.2s ease;}

.hse-permit-icon{font-size:30px;margin-bottom:10px}.hse-permit-title{font-size:16px;font-weight:bold;margin-bottom:8px}.hse-permit-desc{font-size:12px;color:rgba(255,255,255,.82);line-height:1.8}.hse-permit-tag{display:inline-block;margin-top:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);font-size:11px}.hse-section-note{margin:4px 0 14px;padding:12px 15px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.88);font-size:12px;line-height:1.9;}

.checklist-groups{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.checklist-group{border:1px solid #d7dee8;border-radius:12px;overflow:hidden;background:#fff}
.checklist-group>summary{cursor:pointer;list-style:none;padding:13px 15px;font-weight:700;background:#f1f5f9;color:#17324d;display:flex;justify-content:space-between;align-items:center;gap:10px}
.checklist-group>summary::-webkit-details-marker{display:none}
.checklist-group>summary:after{content:'＋';font-size:18px}
.checklist-group[open]>summary:after{content:'−'}
.checklist-group>summary .group-status{margin-right:auto;font-size:12px;font-weight:700;color:#9a6700;background:#fff7df;border-radius:999px;padding:3px 8px}
.checklist-group>summary.group-complete .group-status{color:#166534;background:#dcfce7}
.checklist-group>summary.group-complete{background:#ecfdf3}
.group-count{font-size:12px;font-weight:500;color:#526579;white-space:nowrap}
.checklist-group .table-wrapper{margin:0;padding:0 8px 8px}
.description-box textarea{width:100%;min-height:85px;box-sizing:border-box}

.form-month-group,.form-day-group{border:1px solid #dfe5ec;border-radius:12px;background:#fff;margin:8px 0;overflow:hidden;}
.form-month-group>summary,.form-day-group>summary{list-style:none;cursor:pointer;padding:11px 13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;}
.form-month-group>summary::-webkit-details-marker,.form-day-group>summary::-webkit-details-marker{display:none;}
.form-month-group>summary:after,.form-day-group>summary:after{content:"⌄";font-size:18px;transition:transform .2s;}
.form-month-group[open]>summary:after,.form-day-group[open]>summary:after{transform:rotate(180deg);}
.form-month-body{padding:0 8px 8px;background:#fafcff;}
.form-day-group{margin:7px 0;background:#fff;}
.form-day-group>summary{font-size:14px;background:#f7f9fc;}
.form-day-list{padding:5px;}
.form-day-list .search-item{margin:6px 0;}

========================================================= */

function getFormNumberFromDate(dateString){

    const match = dateString.match(/^1405\/(\d{2})\/(\d{2})$/);
    if(!match) return "";

    const month = parseInt(match[1]);
    const day = parseInt(match[2]);
    const monthDays = [31,31,31,31,31,31,30,30,30,30,30,29];

    if(month < 1 || month > 12) return "";
    if(day < 1 || day > monthDays[month - 1]) return "";

    let formNumber = day;
    for(let i=0;i<month-1;i++) formNumber += monthDays[i];

    return formNumber;
}

function gregorianToJalali(gy, gm, gd){

    const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];

    let jy = (gy <= 1600) ? 0 : 979;
    gy -= (gy <= 1600) ? 621 : 1600;

    const gy2 = (gm > 2) ? gy + 1 : gy;

    let days = (365 * gy)
        + Math.floor((gy2 + 3) / 4)
        - Math.floor((gy2 + 99) / 100)
        + Math.floor((gy2 + 399) / 400)
        - 80 + gd + g_d_m[gm - 1];

    jy += 33 * Math.floor(days / 12053);
    days %= 12053;
    jy += 4 * Math.floor(days / 1461);
    days %= 1461;

    if(days > 365){
        jy += Math.floor((days - 1) / 365);
        days = (days - 1) % 365;
    }

    const jm = days < 186
        ? 1 + Math.floor(days / 31)
        : 7 + Math.floor((days - 186) / 30);

    const jd = 1 + (days < 186
        ? days % 31
        : (days - 186) % 30);

    return {year:jy,month:jm,day:jd};
}

function getTodayJalali(){

    const now = new Date();

    const j = gregorianToJalali(
        now.getFullYear(),
        now.getMonth()+1,
        now.getDate()
    );

    return String(j.year).padStart(4,"0") + "/" +
           String(j.month).padStart(2,"0") + "/" +
           String(j.day).padStart(2,"0");
}

let safetyRequestsMemory=[];
let safetyRequestsOnlineLoaded=false;
let safetyRequestsOnlineLoading=null;
const HSE_ONLINE_FORM_NUMBER="__PMNET_HSE_REQUESTS__";
const HSE_ONLINE_FORM_DATE="2099-12-31";

function getLocalSafetyRequests(){
    try{
        const raw=localStorage.getItem("pmnet_safety_requests");
        if(raw){
            const list=JSON.parse(raw);
            if(Array.isArray(list)) return list;
        }
    }catch(e){}
    try{
        const oldText=localStorage.getItem("pmnet_hse_request_text")||"";
        if(oldText){
            return [{id:Date.now(),text:oldText,status:localStorage.getItem("pmnet_hse_permit_status")||"pending",response:localStorage.getItem("pmnet_hse_supervisor_response")||"",createdAt:new Date().toLocaleString("fa-IR"),dateKey:new Date().toLocaleDateString("fa-IR")}];
        }
    }catch(e){}
    return [];
}
function getSafetyRequests(){
    return Array.isArray(safetyRequestsMemory)?safetyRequestsMemory:[];
}
async function loadSafetyRequestsOnline(){
    if(safetyRequestsOnlineLoaded) return getSafetyRequests();
    if(safetyRequestsOnlineLoading) return safetyRequestsOnlineLoading;
    safetyRequestsOnlineLoading=(async()=>{
        try{
            if(!supabaseClient) await loadSupabase();
            const {data,error}=await supabaseClient
                .from("ccm_forms")
                .select("data")
                .eq("form_number",HSE_ONLINE_FORM_NUMBER)
                .eq("form_date",HSE_ONLINE_FORM_DATE)
                .maybeSingle();
            if(error) throw error;
            const remoteList=data && data.data && Array.isArray(data.data.requests) ? data.data.requests : null;
            if(remoteList){
                safetyRequestsMemory=remoteList;
            }else{
                const localList=getLocalSafetyRequests();
                safetyRequestsMemory=localList;
                if(localList.length){
                    await saveSafetyRequestsOnline(localList);
                }
            }
            safetyRequestsOnlineLoaded=true;
            try{localStorage.setItem("pmnet_safety_requests",JSON.stringify(safetyRequestsMemory));}catch(e){}
        }catch(e){
            console.error("HSE online load error:",e);
            safetyRequestsMemory=getLocalSafetyRequests();
            safetyRequestsOnlineLoaded=true;
        }finally{
            safetyRequestsOnlineLoading=null;
        }
        return getSafetyRequests();
    })();
    return safetyRequestsOnlineLoading;
}
async function saveSafetyRequestsOnline(list){
    const safeList=Array.isArray(list)?list:[];
    if(!supabaseClient) await loadSupabase();
    const {error}=await supabaseClient
        .from("ccm_forms")
        .upsert({
            form_number:HSE_ONLINE_FORM_NUMBER,
            form_date:HSE_ONLINE_FORM_DATE,
            data:{module:"pmnet_hse_requests",requests:safeList},
            updated_at:new Date().toISOString()
        },{onConflict:"form_number,form_date"});
    if(error) throw error;
}
function saveSafetyRequests(list){
    safetyRequestsMemory=Array.isArray(list)?list:[];
    try{localStorage.setItem("pmnet_safety_requests",JSON.stringify(safetyRequestsMemory));}catch(e){}
    saveSafetyRequestsOnline(safetyRequestsMemory).catch(e=>console.error("HSE online save error:",e));
}
function safetyStatusText(status){ return status==="approved"?"✓ تأیید شد":status==="rejected"?"✕ عدم تأیید":"● در انتظار بررسی"; }
function safetyStatusClass(status){ return status==="approved"?"approved":status==="rejected"?"rejected":"pending"; }

function deleteSafetyRequest(id){
    const requests=getSafetyRequests();
    const target=requests.find(r=>String(r.id)===String(id));
    if(!target)return;
    if(!confirm("آیا از حذف این درخواست مطمئن هستید؟"))return;
    const updated=requests.filter(r=>String(r.id)!==String(id));
    saveSafetyRequests(updated);
    showMessage("درخواست حذف شد");
    renderRoles();
}

function normalizeJalaliDigits(value){
    return String(value||"")
        .replace(/[۰-۹]/g, d => String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
        .replace(/[٠-٩]/g, d => String("٠١٢٣٤٥٦٧٨٩".indexOf(d))) ;
}
function getRequestFormDate(r){
    const raw=normalizeJalaliDigits(r.formDate||r.dateKey||"").trim();
    const m=raw.match(/(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/);
    if(m) return `${m[1]}/${String(m[2]).padStart(2,"0")}/${String(m[3]).padStart(2,"0")}`;
    return "";
}
function requestMonthKey(r){
    const raw=getRequestFormDate(r);
    const m=raw.match(/(\d{4})[\/\-](\d{1,2})/);
    if(m) return `${m[1]}/${String(m[2]).padStart(2,"0")}`;
    return "بدون تاریخ";
}
function requestDayKey(r){
    const raw=getRequestFormDate(r);
    if(raw) return raw;
    return "بدون تاریخ";
}
function requestMonthTitle(key){
    const parts=String(key).split("/");
    const months=["","فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
    return parts.length===2 && /^\d{4}$/.test(parts[0]) ? `📅 ${months[Number(parts[1])]||parts[1]} ${parts[0]}` : `📅 ${key}`;
}
function requestDayTitle(key){ return `🗓 ${key}`; }
function groupedRequestsHtml(requests, renderer, outerClass=""){
    if(!requests.length) return "";
    const months={};
    requests.forEach(r=>(months[requestMonthKey(r)]??=[]).push(r));
    const monthKeys=Object.keys(months).sort((a,b)=>b.localeCompare(a));
    return monthKeys.map((mk,mi)=>{
        const days={};
        months[mk].forEach(r=>(days[requestDayKey(r)]??=[]).push(r));
        const dayKeys=Object.keys(days).sort((a,b)=>b.localeCompare(a));
        return `<details class="request-month-group ${outerClass}"><summary>${requestMonthTitle(mk)} <span class="badge">${months[mk].length} درخواست</span></summary><div class="request-group-content">${dayKeys.map((dk,di)=>`<details class="request-day-group"><summary>${requestDayTitle(dk)} <span class="badge">${days[dk].length}</span></summary><div class="request-group-content">${days[dk].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).map(renderer).join("")}</div></details>`).join("")}</div></details>`;
    }).join("");
}

function escapeHtml(value){ return String(value||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function saveSafetyRequest(){
    const el=document.getElementById("safetyRequestText"), text=el?el.value.trim():"";
    if(!text){showMessage("لطفاً متن درخواست را وارد کنید");return;}
    const now=new Date(), requests=getSafetyRequests();
    const toolsEl=document.getElementById("safetyRequestTools");
    const techEl=document.getElementById("safetyRequestTechnicians");
    const tools=toolsEl?toolsEl.value.trim():"";
    const technicians=techEl?techEl.value.trim():"";
    const formDateEl=document.getElementById("formDate");
    const formDate=normalizeJalaliDigits(formDateEl?formDateEl.value.trim():"");
    const requestDate=/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(formDate)?formDate:getTodayJalali();
    const request={id:Date.now(),text:text,tools:tools,technicians:technicians,status:"pending",response:"",createdAt:now.toLocaleString("fa-IR"),formDate:requestDate,dateKey:requestDate};
    requests.push(request);
    saveSafetyRequests(requests);
    if(el) el.value="";
    if(toolsEl) toolsEl.value="";
    if(techEl) techEl.value="";
    showMessage("درخواست ثبت شد");
    renderRoles();
}
function saveSafetyResponse(id){
    if(!currentAccess||currentAccess.role!=="safety-officer")return;
    const el=document.getElementById("safetyResponse-"+id), requests=getSafetyRequests(), item=requests.find(r=>String(r.id)===String(id));
    if(!item)return; item.response=el?el.value.trim():""; saveSafetyRequests(requests); showMessage("توضیحات مسئول ایمنی ثبت شد"); renderRoles();
}
function setSafetyRequestStatus(id,status){
    if(!currentAccess||currentAccess.role!=="safety-officer")return;
    const requests=getSafetyRequests(), item=requests.find(r=>String(r.id)===String(id)); if(!item)return;
    item.status=status; item.reviewedAt=new Date().toLocaleString("fa-IR"); saveSafetyRequests(requests); showMessage(status==="approved"?"درخواست تأیید شد":"درخواست عدم تأیید شد"); renderRoles();
}

        if(!canSeeRole(role.id)) return;
        if(currentAccess && currentAccess.role==="safety-officer" && role.id!=="safety-officer") return;

            html += createTechnicalRequestPanel();

                        <div class="shift-content" id="${role.id}-night-content">${createChecklist(role,"night")}</div>
                    </div>`}
            </div>
        </div>`;
    });
    container.innerHTML=html;

function toggleRole(id){

    const content =
        document.getElementById(
            id + "-content"
        );

    const arrow =
        document.getElementById(
            id + "-arrow"
        );

    if(content.classList.contains("open")){

        content.classList.remove("open");

        arrow.textContent = "▼";

    }else{

        content.classList.add("open");

        arrow.textContent = "▲";

    }

}

async function testConnection(){

    const status =
        document.getElementById(
            "connectionStatus"
        );

    try{

        if(!supabaseClient){
            status.textContent = "در حال اتصال به پایگاه داده...";
            await loadSupabase();
        }

        const { error } =
            await supabaseClient
                .from("ccm_forms")
                .select("id")
                .limit(1);

        if(error){

            console.error(error);

            status.textContent =
                "خطا در اتصال به پایگاه داده";

            status.classList.add("error");

            return;

        }

        status.textContent =
            "● اتصال آنلاین برقرار است";

        status.classList.add("online");

    }catch(error){

        console.error(error);

        status.textContent =

========================================================= */

function collectFormData(){

    const fields = {};

    document
        .querySelectorAll("[data-field]")
        .forEach(el => {

            fields[
                el.getAttribute("data-field")
            ] = el.value;

        });


    const radios = {};

    document
        .querySelectorAll(
            'input[type="radio"][data-radio]:checked'
        )
        .forEach(el => {

            radios[
                el.getAttribute("data-radio")
            ] = el.value;

        });


    return {
        fields,
        radios
    };

}


/* =========================================================
   DAILY ACCESS / VALIDATION
========================================================= */

function getSavedRoles(data){

    if(!data || typeof data !== "object") return {};
    if(!data._ccmMeta || typeof data._ccmMeta !== "object") return {};

    return (data._ccmMeta.savedRoles &&
            typeof data._ccmMeta.savedRoles === "object")
        ? data._ccmMeta.savedRoles
        : {};
}

function getSavedShifts(data){

    if(!data || typeof data !== "object") return {};
    if(!data._ccmMeta || typeof data._ccmMeta !== "object") return {};

    return (data._ccmMeta.savedShifts &&
            typeof data._ccmMeta.savedShifts === "object")
        ? data._ccmMeta.savedShifts
        : {};
}

function validateShiftBeforeSave(roleId, shift, data){

    const fields = data.fields || {};
    const radios = data.radios || {};
    const role = roles.find(r => r.id === roleId);

    if(!role){
        return {ok:false,message:"نقش انتخاب‌شده معتبر نیست."};
    }

    const employeeKey = `${roleId}_${shift}_employee`;

    if(!fields[employeeKey]){
        return {
            ok:false,
            message:`نام پرسنل شیفت ${shift === "day" ? "روز" : "شب"} انتخاب نشده است.`
        };
    }

    for(let i=0;i<role.items.length;i++){

        const key = `${roleId}_${shift}_item_${i}`;

        if(!radios[key]){
            return {
                ok:false,
                message:`تمام گزینه‌های چک‌لیست شیفت ${shift === "day" ? "روز" : "شب"} باید تعیین وضعیت شوند. مورد شماره ${i+1} تکمیل نشده است.`
            };
        }
    }

    return {ok:true};
}

function lockShift(roleId, shift){

    if(!currentAccess ||
       currentAccess.role === "manager" ||
       currentAccess.role === "safety-officer") return;

    document.querySelectorAll(
        `[data-field^="${roleId}_${shift}_"], input[type="radio"][data-radio^="${roleId}_${shift}_"]`
    ).forEach(el => el.disabled = true);

    const button = document.querySelector(
        `[data-shift-save="${roleId}_${shift}"]`
    );

    if(button){
        button.disabled = true;
        button.innerHTML = `✅ شیفت ${shift === "day" ? "روز" : "شب"} ثبت شده`;
    }
}

function lockCurrentRole(){

    if(!currentAccess ||
       currentAccess.role === "manager" ||
       currentAccess.role === "safety-officer") return;

    const roleId = currentAccess.role;
    const savedShifts = window._ccmSavedShifts || {};

    ["day","night"].forEach(shift => {
        if(savedShifts[`${roleId}_${shift}`]){
            lockShift(roleId, shift);
        }
    });
}

async function checkTodayRoleSaved(){

    if(!currentAccess ||
       currentAccess.role === "manager" ||
       currentAccess.role === "safety-officer") return false;

    if(!supabaseClient){
        try{ await loadSupabase(); }catch(e){ return false; }
    }

    const formNumber = document.getElementById("formNumber").value;
    const formDate = document.getElementById("formDate").value;

    try{

        const {data,error} = await supabaseClient
            .from("ccm_forms")
            .select("data")
            .eq("form_number",String(formNumber))
            .eq("form_date",formDate)
            .maybeSingle();

        if(error) throw error;

        const formData = data ? data.data : null;
        const savedShifts = getSavedShifts(formData);
        const savedRoles = getSavedRoles(formData);

        window._ccmSavedShifts = savedShifts;
        window._ccmSavedGroups = formData && formData._ccmMeta ? (formData._ccmMeta.savedGroups || {}) : {};
        lockSavedChecklistGroups();
        refreshAllChecklistGroupStatus();

        // سازگاری با نسخه قبلی: اگر نقش قبلاً کامل ثبت شده باشد، هر دو شیفت قفل شوند.
        if(savedRoles[currentAccess.role]){
            ["day","night"].forEach(shift => {
                savedShifts[`${currentAccess.role}_${shift}`] = savedRoles[currentAccess.role];
            });
            window._ccmSavedShifts = savedShifts;
        }

        ["day","night"].forEach(shift => {
            if(savedShifts[`${currentAccess.role}_${shift}`]){
                lockShift(currentAccess.role, shift);
            }
        });

        return Boolean(
            savedShifts[`${currentAccess.role}_day`] ||
            savedShifts[`${currentAccess.role}_night`]
        );

    }catch(error){
        console.error(error);
    }

    return false;
}

/* =========================================================

function groupFieldPrefix(roleId,shift,groupIndex){ return `${roleId}_${shift}_group_${groupIndex}_`; }
function getGroupItemIndexes(roleId,shift,groupIndex){
    const role=roles.find(r=>r.id===roleId); if(!role || !role.groups || !role.groups[groupIndex]) return [];
    let start=0; for(let i=0;i<groupIndex;i++) start+=role.groups[i].items.length;
    return role.groups[groupIndex].items.map((_,i)=>start+i);
}
async function saveChecklistGroup(roleId,shift,groupIndex){
    if(!currentAccess || currentAccess.role!==roleId){ alert("شما اجازه ثبت این بخش را ندارید."); return; }
    const formNumber=document.getElementById("formNumber").value;
    const formDate=document.getElementById("formDate").value;
    const indexes=getGroupItemIndexes(roleId,shift,groupIndex);
    if(!indexes.length) return;
    const employee=document.querySelector(`[data-field="${roleId}_${shift}_employee"]`)?.value||"";
    if(!employee){ alert("ابتدا پرسنل شیفت را انتخاب کنید."); return; }
    for(const i of indexes){
        const radios=document.querySelectorAll(`input[data-radio="${roleId}_${shift}_item_${i}"]`);
        if(![...radios].some(x=>x.checked)){ alert(`تمام موارد کشوی «${roles.find(r=>r.id===roleId).groups[groupIndex].title}» باید تعیین وضعیت شوند.`); return; }
    }
    showLoading();
    try{
        if(!supabaseClient) await loadSupabase();
        const {data:existing,error:existingError}=await supabaseClient.from("ccm_forms").select("data").eq("form_number",String(formNumber)).eq("form_date",formDate).maybeSingle();
        if(existingError) throw existingError;
        const existingData=existing&&existing.data?existing.data:{};
        const savedGroups=existingData._ccmMeta?.savedGroups||{};
        const groupKey=`${roleId}_${shift}_${groupIndex}`;
        if(savedGroups[groupKey]){ alert("این کشو قبلاً ذخیره شده است."); lockChecklistGroup(roleId,shift,groupIndex); return; }
        const fields={...(existingData.fields||{})};
        const radios={...(existingData.radios||{})};
        const employeeEl=document.querySelector(`[data-field="${roleId}_${shift}_employee"]`);
        const descEl=document.querySelector(`[data-field="${roleId}_${shift}_description"]`);
        fields[`${roleId}_${shift}_employee`]=employeeEl?.value||"";
        fields[`${roleId}_${shift}_description`]=descEl?.value||"";
        indexes.forEach(i=>{
            const d=document.querySelector(`[data-field="${roleId}_${shift}_item_${i}_description"]`);
            const r=document.querySelector(`input[data-radio="${roleId}_${shift}_item_${i}"]:checked`);
            fields[`${roleId}_${shift}_item_${i}_description`]=d?.value||"";
            if(r) radios[`${roleId}_${shift}_item_${i}`]=r.value;
        });
        const merged={fields,radios,_ccmMeta:{...(existingData._ccmMeta||{}),savedGroups:{...savedGroups,[groupKey]:{title:roles.find(r=>r.id===roleId).groups[groupIndex].title,role:roleId,shift:shift,savedAt:new Date().toISOString()}}}};
        const {error}=await supabaseClient.from("ccm_forms").upsert({form_number:String(formNumber),form_date:formDate,data:merged,updated_at:new Date().toISOString()},{onConflict:"form_number,form_date"});
        if(error) throw error;
        window._ccmSavedGroups=merged._ccmMeta.savedGroups;
        lockChecklistGroup(roleId,shift,groupIndex);
        showMessage(`✅ کشوی «${roles.find(r=>r.id===roleId).groups[groupIndex].title}» جداگانه ذخیره شد.`);
    }catch(e){ console.error(e); alert("خطا در ذخیره کشو:\n\n"+e.message); }
    finally{ hideLoading(); }
}
function updateChecklistGroupStatus(roleId,shift,groupIndex){
    const indexes=getGroupItemIndexes(roleId,shift,groupIndex);
    if(!indexes.length) return false;
    const complete=indexes.every(i=>[...document.querySelectorAll(`input[data-radio="${roleId}_${shift}_item_${i}"]`)].some(x=>x.checked));
    const summary=document.querySelector(`[data-group-summary="${roleId}_${shift}_${groupIndex}"]`);
    const status=document.querySelector(`[data-group-status="${roleId}_${shift}_${groupIndex}"]`);
    if(summary) summary.classList.toggle('group-complete',complete);
    if(status) status.textContent=complete?'✅ تکمیل شده':'⏳ تکمیل نشده';
    return complete;
}
function refreshAllChecklistGroupStatus(){
    if(!currentAccess) return;
    const targetRoles = currentAccess.role === "manager" || currentAccess.role === "safety-officer" ? roles : roles.filter(r=>r.id===currentAccess.role);
    const saved = window._ccmSavedGroups || {};
    targetRoles.forEach(role=>{
        if(!role.groups) return;
        ['day','night'].forEach(shift=>role.groups.forEach((_,gi)=>{
            const completeByInputs = updateChecklistGroupStatus(role.id,shift,gi);
            const key = `${role.id}_${shift}_${gi}`;
            if(saved[key]){
                const summary=document.querySelector(`[data-group-summary="${role.id}_${shift}_${gi}"]`);
                const status=document.querySelector(`[data-group-status="${role.id}_${shift}_${gi}"]`);
                if(summary) summary.classList.add('group-complete');
                if(status) status.textContent='✅ ثبت و تکمیل شده';
            }
        }));
    });
}

function lockChecklistGroup(roleId,shift,groupIndex){
    const role=roles.find(r=>r.id===roleId); if(!role||!role.groups) return;
    const indexes=getGroupItemIndexes(roleId,shift,groupIndex);
    indexes.forEach(i=>{
        document.querySelectorAll(`input[data-radio="${roleId}_${shift}_item_${i}"], [data-field="${roleId}_${shift}_item_${i}_description"]`).forEach(el=>el.disabled=true);
    });
    const summary=document.querySelector(`[data-group-summary="${roleId}_${shift}_${groupIndex}"]`);

    if(b){b.disabled=true;b.innerHTML="✅ این کشو ثبت شده";}

function lockSavedChecklistGroups(){
    if(!currentAccess || currentAccess.role==="manager" || currentAccess.role==="safety-officer") return;
    const saved=window._ccmSavedGroups||{};
    Object.keys(saved).forEach(k=>{const parts=k.split("_"); const roleId=parts.slice(0,-2).join("_"); const shift=parts[parts.length-2]; const gi=Number(parts[parts.length-1]); if(roleId===currentAccess.role) lockChecklistGroup(roleId,shift,gi);});
}

/* =========================================================
   SAVE SHIFT
========================================================= */

async function saveShift(roleId, shift){

    if(!currentAccess){
        alert("ابتدا وارد سیستم شوید.");
        return;
    }

    if(currentAccess.role !== roleId){
        alert("شما اجازه ثبت این بخش را ندارید.");
        return;
    }

    if(currentAccess.role === "manager" ||
       currentAccess.role === "safety-officer"){
        alert("این سطح دسترسی برای مشاهده است و ثبت مستقیم انجام نمی‌دهد.");
        return;
    }

    const formNumber = document.getElementById("formNumber").value;
    const formDate = document.getElementById("formDate").value;
    const button = document.querySelector(`[data-shift-save="${roleId}_${shift}"]`);

    showLoading();

    try{

        const finalData = collectFormData();
        const validation = validateShiftBeforeSave(roleId, shift, finalData);

        if(!validation.ok){
            alert("⚠️ " + validation.message);
            return;
        }

        const {data:existing,error:existingError} =
            await supabaseClient
                .from("ccm_forms")
                .select("data")
                .eq("form_number",String(formNumber))
                .eq("form_date",formDate)
                .maybeSingle();

        if(existingError) throw existingError;

        const existingData =
            existing && existing.data ? existing.data : {};

        const savedShifts = getSavedShifts(existingData);
        const shiftKey = `${roleId}_${shift}`;

        if(savedShifts[shiftKey]){
            lockShift(roleId, shift);
            alert(`شیفت ${shift === "day" ? "روز" : "شب"} امروز قبلاً ذخیره شده است و امکان ثبت مجدد ندارد.`);
            return;
        }

        // فقط اطلاعات همین شیفت از فرم فعلی ذخیره/به‌روزرسانی می‌شود.
        const shiftPrefix = `${roleId}_${shift}_`;
        const shiftFields = {};
        const shiftRadios = {};

        Object.entries(finalData.fields || {}).forEach(([key,value]) => {
            if(key.startsWith(shiftPrefix)) shiftFields[key] = value;
        });

        Object.entries(finalData.radios || {}).forEach(([key,value]) => {
            if(key.startsWith(shiftPrefix)) shiftRadios[key] = value;
        });

        const mergedData = {
            fields:{
                ...(existingData.fields || {}),
                ...shiftFields
            },
            radios:{
                ...(existingData.radios || {}),
                ...shiftRadios
            },
            _ccmMeta:{
                ...(existingData._ccmMeta || {}),
                savedShifts:{
                    ...savedShifts,
                    [shiftKey]:{
                        title:currentAccess.title,
                        shift:shift,
                        savedAt:new Date().toISOString()
                    }
                }
            }
        };

        const {error} = await supabaseClient
            .from("ccm_forms")
            .upsert({
                form_number:String(formNumber),
                form_date:formDate,
                data:mergedData,
                updated_at:new Date().toISOString()
            },{
                onConflict:"form_number,form_date"
            });

        if(error) throw error;

        window._ccmSavedShifts = mergedData._ccmMeta.savedShifts;
        lockShift(roleId, shift);

        showMessage(`✅ شیفت ${shift === "day" ? "روز" : "شب"} با موفقیت ثبت شد؛ این شیفت تا پایان امروز قفل شد.`);

    }catch(error){

        console.error(error);
        alert("خطا در ذخیره فرم:\n\n" + error.message);

    }finally{

        hideLoading();

    }
}

/* =========================================================
   APPLY FORM DATA
========================================================= */

function applyFormData(data){

    if(!data){
        return;
    }


    const fields =
        data.fields || {};

    const radios =
        data.radios || {};


    document
        .querySelectorAll("[data-field]")
        .forEach(el => {

            const key =
                el.getAttribute(
                    "data-field"
                );

            if(
                Object.prototype.hasOwnProperty.call(
                    fields,
                    key
                )
            ){

                el.value =
                    fields[key];

            }

        });


    document
        .querySelectorAll(
            'input[type="radio"][data-radio]'
        )
        .forEach(el => {

            const key =
                el.getAttribute(
                    "data-radio"
                );

            el.checked =
                radios[key] === el.value;

        });

}

            monthSummary.innerHTML=`📅 ${_monthsFa[Number(jm)]||`ماه ${jm}`} ${jy} <span class="small">${Object.values(groups[monthKey]).flat().length} فرم</span>`;
            monthDetails.appendChild(monthSummary);
            const monthBody=document.createElement("div"); monthBody.className="form-month-body";
            Object.keys(groups[monthKey]).sort((a,b)=>b.localeCompare(a)).forEach((dayKey,di)=>{
                const dayItems=groups[monthKey][dayKey], day=dayKey.split("/")[2];
                const dayDetails=document.createElement("details"); dayDetails.className="form-day-group"; 
                const daySummary=document.createElement("summary"); daySummary.innerHTML=`🗓️ روز ${day} <span class="small">${dayItems.length} فرم</span>`;
                dayDetails.appendChild(daySummary);
                const list=document.createElement("div"); list.className="form-day-list";
                dayItems.forEach(item=>{
                    const div=document.createElement("div"); div.className="search-item";
                    const info=document.createElement("div"); info.className="search-info";
                    let updated=""; if(item.updated_at){try{updated=new Date(item.updated_at).toLocaleString("fa-IR");}catch(e){updated=item.updated_at;}}
                    info.innerHTML=`<strong>فرم شماره ${escapeHtml(item.form_number)}</strong><br>تاریخ: ${escapeHtml(item.form_date)}<br>آخرین ویرایش: ${escapeHtml(updated||"-")}`;
                    const button=document.createElement("button"); button.className="search-load"; button.textContent="باز کردن";
                    button.onclick=()=>{document.getElementById("formNumber").value=item.form_number;document.getElementById("formDate").value=item.form_date;loadForm(item.form_number,item.form_date);document.getElementById("searchPanel").classList.remove("open");};
                    div.appendChild(info); div.appendChild(button); list.appendChild(div);
                });
                dayDetails.appendChild(list); monthBody.appendChild(dayDetails);
            });
            monthDetails.appendChild(monthBody); results.appendChild(monthDetails);
        });
    }catch(e){ console.error(e); results.innerHTML="خطا در دریافت فرم‌ها"; }
}

/* =========================================================
   EXCEL EXPORT (LIGHTWEIGHT, WITHOUT EXTERNAL LIBRARY)
========================================================= */
function downloadExcelHtml(filename, htmlContent){
    const blob = new Blob([
        "\ufeff",
        '<html><head><meta charset="UTF-8"></head><body dir="rtl">',
        htmlContent,
        '</body></html>'
    ], {type:"application/vnd.ms-excel;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function exportManagementExcel(){
    if(typeof isManagement === "function" && !isManagement()){
        alert("فقط مدیر می‌تواند خروجی اکسل دریافت کند.");
        return;
    }

    const container =
        document.getElementById("searchResults") ||
        document.getElementById("managerHistory") ||
        document.getElementById("dailyAttendanceTable");

    if(!container){
        alert("بخش اطلاعات برای خروجی اکسل پیدا نشد.");
        return;
    }

    let content = "";

    if(container.tagName === "TABLE"){
        content = container.outerHTML;
    }else{
        const table = container.querySelector("table");
        if(table){
            content = table.outerHTML;
        }else{
            const items = container.querySelectorAll(".search-item");
            if(items.length){
                content = '<table border="1" cellspacing="0" cellpadding="6"><thead><tr><th>اطلاعات</th></tr></thead><tbody>';
                items.forEach(item => {
                    const safe = String(item.innerText || "")
                        .replace(/&/g,"&amp;")
                        .replace(/</g,"&lt;")
                        .replace(/>/g,"&gt;")
                        .replace(/\n/g,"<br>");
                    content += "<tr><td>" + safe + "</td></tr>";
                });
                content += "</tbody></table>";
            }else{
                const text = String(container.innerText || "").trim();
                if(text){
                    const safe = text
                        .replace(/&/g,"&amp;")
                        .replace(/</g,"&lt;")
                        .replace(/>/g,"&gt;")
                        .replace(/\n/g,"<br>");
                    content = '<table border="1" cellspacing="0" cellpadding="6"><tr><td>' + safe + '</td></tr></table>';
                }
            }
        }
    }

    if(!content){
        alert("اطلاعاتی برای خروجی اکسل وجود ندارد. ابتدا سوابق را نمایش دهید.");
        return;
    }

    const title = document.title || "گزارش سامانه";
    const date = new Date().toISOString().slice(0,10);
    downloadExcelHtml(title.replace(/[\\/:*?"<>|]/g,"-") + "_" + date + ".xls", content);
}
